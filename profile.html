
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile | SMCC Connect</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js" defer></script>
    <script src="js/profile.js" defer></script>
    <script src="js/nav.js" defer></script>
</head>
<body>
    <nav class="navbar">
        <a class="brand" href="dashboard.html">SMCC Connect</a>
        <div class="nav-links">
            <a href="dashboard.html">Dashboard</a>
            <a href="announcements.html">Announcements</a>
            <a href="messages.html">Messages</a>
            <button id="logout-button" class="btn btn-small">Logout</button>
        </div>
    </nav>

    <main class="container">
        <section class="form-card">
            <h1>My Profile</h1>
            <p id="profile-email"></p>
            <p><small>Your profile ID (share this so others can message you):<br>
            <code id="profile-id"></code></small></p>

            <form id="profile-form">
                <label for="full_name">Full name</label>
                <input id="full_name" maxlength="100" required>

                <button class="btn" type="submit">Save Changes</button>
                <p id="profile-status" role="status"></p>
            </form>
        </section>
    </main>
</body>
</html>
