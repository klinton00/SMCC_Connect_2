
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | SMCC Connect</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js" defer></script>
    <script src="js/auth.js" defer></script>
</head>
<body>
    <main class="auth-card">
        <a class="brand" href="index.html">SMCC Connect</a>
        <h1>Welcome back</h1>
        <p>Log in to connect with fellow students.</p>

        <form id="login-form">
            <label for="email">Email address</label>
            <input id="email" name="email" type="email" required>

            <label for="password">Password</label>
            <input id="password" name="password"
                   type="password" required>

            <button class="btn" type="submit">Log in</button>
            <p id="form-message" role="status"></p>
        </form>

        <p>New to SMCC Connect?
            <a href="register.html">Create an account</a>
        </p>
    </main>
</body>
</html>
