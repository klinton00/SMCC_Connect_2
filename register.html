<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | SMCC Connect</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js" defer></script>
    <script src="js/auth.js" defer></script>
</head>
<body>
    <main class="auth-card">
        <a class="brand" href="index.html">SMCC Connect</a>
        <h1>Create an account</h1>
        <p>Join the SMCC student community.</p>

        <form id="register-form">
            <label for="full_name">Full name</label>
            <input id="full_name" name="full_name"
                   type="text" maxlength="100" required>

            <label for="email">Email address</label>
            <input id="email" name="email"
                   type="email" autocomplete="email" required>

            <label for="password">Password</label>
            <input id="password" name="password"
                   type="password" minlength="8" autocomplete="new-password" required>

            <button class="btn" type="submit">Create account</button>
            <p id="form-message" role="status"></p>
        </form>

        <p>Already registered?
            <a href="login.html">Log in</a>
        </p>
    </main>
</body>
</html>
